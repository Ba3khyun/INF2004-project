# Mosquitto config for IS-06 bench tests (Buddy 1 Wi-Fi telemetry).
# Mosquitto 2.x only accepts connections from this PC unless a listener is
# configured, so the Pico W could not reach it with the default config.
#
#   "C:\Program Files\mosquitto\mosquitto.exe" -c tools\mosquitto_is06.conf -v
#
# Port 1884, not 1883: the Windows installer starts a "mosquitto" service on
# 1883 that only listens on localhost, and stopping it needs admin rights.
# MQTT_BROKER_PORT in config/wifi_secrets.h must match.
#
# Anonymous and unencrypted: use it only on your own hotspot, never on a
# shared network (see G14 / R4 in docs/buddy1_wifi_telemetry.md).
listener 1884 0.0.0.0
allow_anonymous true
